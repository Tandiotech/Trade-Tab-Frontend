  <script>
  function toggleModal(isVisible) {
  const body = document.body;

  if (isVisible) {
    body.classList.add('modal-active'); // Activar el modal
  } else {
    body.classList.remove('modal-active'); // Desactivar el modal
  }
}

// Ejemplo: Mostrar el modal después de 2 segundos
setTimeout(() => toggleModal(true), 1000);

// Ejemplo: Cerrar el modal después de 5 segundos
setTimeout(() => toggleModal(false), 1000);
  </script>
